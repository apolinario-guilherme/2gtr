<html lang="pt-BR"><head><meta charset="UTF-8"><title>t56</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="shell"><aside id="sidebar"><nav id="side-nav" aria-label="Navegação principal"><a href="#/dashboard" data-r="dashboard"><span class="nl">Visão geral</span></a><span class="nav-group">Minha vida</span><a href="#/agenda" data-r="agenda"><span class="nl">Agenda</span></a><a href="#/tasks" data-r="tasks"><span class="nl">Tarefas</span></a><a href="#/lists" data-r="lists"><span class="nl">Listas</span></a><a href="#/routines" data-r="routines"><span class="nl">Rotinas</span></a><a href="#/projects" data-r="projects"><span class="nl">Projetos</span></a><a href="#/habits" data-r="habits"><span class="nl">Hábitos</span></a></nav><div class="side-foot"><button class="sb-toggle" id="sb-toggle">‹</button></div></aside><div class="main"><header id="topbar"><strong id="page-title">x</strong><span><button id="avatar-btn">A</button></span></header><main id="view"></main></div></div>

<div id="toasts"></div><div id="modal-root"></div><div id="o7">...</div>
<script src="js/db.js?cb=905"></script>
<script src="js/auth.js?cb=905"></script>
<script src="js/router.js?cb=905"></script>
<script src="js/app.js?cb=905"></script>
<script>
(function(){
var DB=window.Juntos.DB, Auth=window.Juntos.Auth, App=window.Juntos.App;
var P=0,F=0,L=[];
function ok(c,m){if(c){P++;}else{F++;L.push('FAIL '+m);}}
function eq(a,b,m){ok(a===b,m+' [esp '+JSON.stringify(b)+' veio '+JSON.stringify(a)+']');}
function throws(fn,m){var t=false;try{fn();}catch(e){t=true;}ok(t,m);}
function html(){return document.getElementById('view').innerHTML;}
function shows(t,m){ok(html().indexOf(t)>=0,m);}
function hides(t,m){ok(html().indexOf(t)<0,m);}
function as(uid){localStorage.setItem('juntos_session_v1',JSON.stringify({userId:uid}));}
try{localStorage.clear();}catch(e){}
window.scrollTo=function(){};
DB.AI_CONFIG=function(){return {provider:'local-deterministic',model:'local-v1',maxTokens:500,temperature:0,timeoutMs:15000,maxContext:10,maxMessageChars:10000,ratePerMinute:100000};};
DB._waOutbox=[];
try{ App.boot(); }catch(e){ L.push('FAIL boot '+e.message); }
try{
var A=Auth.register('Ana P','ana.p@t.t','senha123');
var B=Auth.register('Bruno P','bruno.p@t.t','senha123');
DB.createCouple(A.id,'Casal P');
var inv=DB.createInvite(A.id); DB.acceptInvite(B.id,inv.code);
as(A.id);
var TODAY=DB.agendaToday(), SOON=DB.agendaAddDays(TODAY,3), LATER=DB.agendaAddDays(TODAY,60);
/* --- CRUD + defaults --- */
var p1=DB.createProject(A.id,{name:'Estudos'});
eq(p1.visibility,'PERSONAL','default personal');
eq(p1.status,'PLANNING','default planning');
var p2=DB.createProject(A.id,{name:'Viagem Itália',visibility:'COUPLE',target_date:SOON});
throws(function(){DB.createProject(A.id,{name:'X'});},'nome curto');
throws(function(){DB.createProject(A.id,{name:'Ok',visibility:'TRIO'});},'vis invalida');
throws(function(){DB.createProject(A.id,{name:'Ok',target_date:'2020-01-01'});},'prazo invalido');
DB.updateProject(A.id,p1.id,{description:'Faculdade'});
eq(DB.getProject(A.id,p1.id).description,'Faculdade','update');
DB.pauseProject(A.id,p1.id);
eq(DB.getProject(A.id,p1.id).status,'PAUSED','pausa');
DB.resumeProject(A.id,p1.id);
eq(DB.getProject(A.id,p1.id).status,'ACTIVE','retoma');
DB.archiveProject(A.id,p1.id);
eq(DB.getProject(A.id,p1.id).status,'ARCHIVED','arquiva');
var pDel=DB.createProject(A.id,{name:'Apagar'});
DB.deleteProject(A.id,pDel.id);
throws(function(){DB.getProject(A.id,pDel.id);},'soft delete');
/* --- fixtures de entidades --- */
var tP=DB.createTask(A.id,{title:'Estudar capítulo 3'});
var tC=DB.createTask(A.id,{title:'Renovar passaporte',visibility:'COUPLE',due_date:SOON});
var tC2=DB.createTask(A.id,{title:'Comprar passagem',visibility:'COUPLE'});
var li=DB.createList(A.id,{name:'O que levar',visibility:'COUPLE'});
DB.addItem(A.id,li.id,{title:'Adaptador'});
var ag=DB.createAgendaEvent(A.id,{title:'Voo de ida',date:SOON,visibility:'COUPLE'});
var rt=DB.createRoutine(A.id,{name:'Check viagem',visibility:'COUPLE'});
DB.addRoutineItem(A.id,rt.id,{title:'Conferir documentos'});
var gl=DB.createGoal(A.id,{name:'Meta Itália',target_amount:'10000',current_amount:'1000',deadline:''});
var pl=DB.createPlan(A.id,{name:'Plano Itália',period_start:TODAY,period_end:LATER});
/* --- links --- */
var l1=DB.linkEntity(A.id,p2.id,{entity_type:'GOAL',entity_id:gl.id,relationship_type:'PRIMARY'});
var l2=DB.linkEntity(A.id,p2.id,{entity_type:'TASK',entity_id:tC.id});
DB.linkEntity(A.id,p2.id,{entity_type:'TASK',entity_id:tC2.id});
DB.linkEntity(A.id,p2.id,{entity_type:'LIST',entity_id:li.id});
DB.linkEntity(A.id,p2.id,{entity_type:'AGENDA_EVENT',entity_id:ag.id});
DB.linkEntity(A.id,p2.id,{entity_type:'ROUTINE',entity_id:rt.id});
DB.linkEntity(A.id,p2.id,{entity_type:'FINANCIAL_PLAN',entity_id:pl.id});
eq(DB.linkEntity(A.id,p2.id,{entity_type:'TASK',entity_id:tC.id}).id,l2.id,'link duplicado idempotente');
throws(function(){DB.linkEntity(A.id,p2.id,{entity_type:'TASK',entity_id:tP.id});},'personal em casal DENIED');
DB.linkEntity(A.id,p1.id,{entity_type:'TASK',entity_id:tC.id});
ok(true,'casal em personal ok');
var lTmp=DB.linkEntity(A.id,p2.id,{entity_type:'LIST',entity_id:li.id});
DB.unlinkEntity(A.id,lTmp.id);
ok(DB.getProjectLinks(A.id,p2.id).filter(function(l){return l.entity_type==='LIST';}).length===0,'unlink remove');
DB.linkEntity(A.id,p2.id,{entity_type:'LIST',entity_id:li.id});
throws(function(){DB.linkEntity(A.id,p2.id,{entity_type:'TASK',entity_id:'tx_falso'});},'entidade inexistente');
throws(function(){DB.linkEntity(A.id,p2.id,{entity_type:'DOC',entity_id:'x'});},'tipo futuro bloqueado');
/* --- privacidade --- */
as(B.id);
throws(function(){DB.getProject(B.id,p1.id);},'parceiro nao ve personal');
eq(DB.getProject(B.id,p2.id).name,'Viagem Itália','casal visivel');
throws(function(){DB.updateProject(B.id,p1.id,{name:'Hack'});},'parceiro nao edita');
throws(function(){DB.getTask(B.id,tP.id);},'tarefa personal segue privada');
as(A.id);
/* --- agregacao factual --- */
var ov=DB.getProjectOverview(A.id,p2.id);
ok(ov.tasks.ok&&ov.tasks.data.total===2,'overview tarefas');
ok(ov.lists.ok&&ov.lists.data.length===1,'overview listas');
ok(ov.agenda.ok&&ov.agenda.data.length===1,'overview agenda');
ok(ov.routines.ok&&ov.routines.data.length===1,'overview rotinas');
ok(ov.goals.ok&&ov.goals.data[0].pct===10,'overview meta 10%');
ok(ov.plans.ok&&ov.plans.data.length===1,'overview plano');
ok(ov.upcoming.ok&&ov.upcoming.data.length>=2,'overview proximos');
eq(ov.upcoming.data[0].date <= ov.upcoming.data[1].date,true,'ordem cronologica');
var pr=DB.getProjectProgress(A.id,p2.id);
eq(pr.tasks.total,2,'progresso tarefas');
var sm=DB.getProjectSummary(A.id,p2.id);
eq(sm.taskTotal,2,'summary total');
eq(sm.goalPct,10,'summary meta');
ok(DB.getRelevantProjects(A.id,3).some(function(s){return s.id===p2.id;}),'relevantes');
ok(DB.getProjectActivity(A.id,p2.id,20).length>=5,'atividade');
/* --- estado externo reflete sem copia --- */
DB.completeTask(A.id,tC.id);
eq(DB.getProjectTasks(A.id,p2.id).done,1,'reflete conclusao');
/* --- conclusao com pendencias --- */
var pendMsg='';
try{DB.completeProject(A.id,p2.id,{});}catch(e){pendMsg=e.message;}
ok(pendMsg.indexOf('ainda possui')>=0,'avisa pendencias');
DB.completeProject(A.id,p2.id,{force:true});
eq(DB.getProject(A.id,p2.id).status,'COMPLETED','conclui forcado');
eq(DB.getTask(A.id,tC2.id).status,'TODO','entidades intactas');
DB.reopenProject(A.id,p2.id);
eq(DB.getProject(A.id,p2.id).status,'ACTIVE','reabre');
/* --- mudanca de visibilidade protegida --- */
DB.linkEntity(A.id,p1.id,{entity_type:'TASK',entity_id:tP.id});
throws(function(){DB.updateProject(A.id,p1.id,{visibility:'COUPLE'});},'personal->couple bloqueado');
/* --- financas intactas --- */
var tx0=DB.listTx(A.id,{}).length;
DB.getProjectOverview(A.id,p2.id);
eq(DB.listTx(A.id,{}).length,tx0,'agregacao nao cria tx');
/* --- notificacao de prazo --- */
DB.notifScan(A.id,{});
ok(DB.notifList(A.id,{type:'project_deadline_approaching'}).some(function(n){return n.related_entity_id===p2.id;}),'deadline scan');
as(B.id);
ok(!DB.notifList(B.id,{type:'project_deadline_approaching'}).some(function(n){return n.related_entity_id===p1.id;}),'personal nunca vaza');
as(A.id);
/* --- IA --- */
var conv=DB.aiCreateConversation(A.id,'PJ');
function ask(t){return DB.aiProcessMessage(A.id,conv.id,t,{channel:'web'});}
var q0=ask('Cria um projeto pessoal para meus estudos');
eq(q0.intent,'project_create','intent criar');
ok(!q0.pendingAction,'pessoal direto');
ok(DB.searchProjects(A.id,'estudos').length>=1,'criado via IA');
var q1=ask('Cria um projeto para nossa viagem para Argentina');
eq(q1.intent,'project_create','intent criar casal');
ok(!!q1.pendingAction,'casal confirma');
ask('sim');
ok(DB.searchProjects(A.id,'Argentina').length>=1,'casal via IA');
var q2=ask('Como está nossa viagem para Itália?');
eq(q2.intent,'project_detail','intent detalhe');
ok(q2.answer.indexOf('Viagem')>=0,'resumo factual');
var q3=ask('O que falta na viagem para Itália?');
eq(q3.intent,'project_detail','intent falta');
var q4=ask('Adiciona uma tarefa para comprar adaptador na viagem para Itália');
eq(q4.intent,'project_create_task','intent criar tarefa');
var q5=ask('Vincula nossa meta da viagem ao projeto da viagem para Itália');
eq(q5.intent,'project_link_goal','intent vincular meta');
var q6=ask('Onde fica a tela de projetos?');
eq(q6.intent,'product_navigation','nav');
eq(q6.navigationTarget,'#/projects','nav projetos');
var q7=ask('Como está a viagem?');
eq(q7.intent,'project_detail','nome parcial resolve');
/* --- conversa com contexto --- */
var conv2=DB.aiCreateConversation(A.id,'PJ2');
function ask2(t){return DB.aiProcessMessage(A.id,conv2.id,t,{channel:'web'});}
ask2('Como está nossa viagem para Itália?');
var qc=ask2('Adiciona uma tarefa para comprar protetor.');
eq(qc.intent,'project_create_task','contexto resolve');
ok(!!qc.pendingAction,'casal confirma via contexto');
/* --- whatsapp --- */
var PHONE='+5511999990005';
var lk=DB.waGenerateLinkCode(A.id);
DB.waConsumeLinkCode(PHONE,lk.code);
function wa(t,iid){return DB.whatsappWebhookReceive('local-sim',{messageId:iid,from:PHONE,type:'text',text:t});}
var w1=wa('/projetos','wp1');
eq(w1.intent,'project_list','wa projetos');
var w2=wa('Como está nossa viagem para Itália?','wp2');
eq(w2.intent,'project_detail','wa detalhe');
/* --- UI --- */
location.hash='#/projects';
App.render('projects');
shows('Projetos','pagina');
shows('+ Novo projeto','criar');
shows('Ativos','abas');
document.getElementById('pj-new').onclick();
ok(!!document.getElementById('f-pn'),'form abre');
document.getElementById('f-pn').value='Projeto UI';
document.getElementById('sv').onclick();
var cru=DB.searchProjects(A.id,'Projeto UI')[0];
ok(!!cru,'criado via UI');
App.render('projects/'+cru.id);
shows('Projeto UI','detalhe');
shows('Próximo passo','proximo');
shows('Vincular','vincular');
App.render('dashboard');
shows('Ver projeto','dash card');
App.render('more');
shows('Projetos','mais');
ok(document.querySelector('#side-nav a[data-r="projects"]'),'sidebar');
as(B.id);
App.render('projects');
hides('Estudos','B nao ve personal');
hides('Um estudos','B nao ve personal IA');
as(A.id);
/* --- regressao --- */
App.render('agenda'); shows('Agenda','agenda ok');
App.render('tasks'); shows('Tarefas','tasks ok');
App.render('lists'); shows('Listas','lists ok');
App.render('habits'); shows('Meus hábitos','habitos ok');
App.render('routines'); shows('Rotinas','routines ok');
App.render('transactions'); shows('Receitas','tx ok');
App.render('reports'); shows('Relatórios','reports ok');
App.render('notifications'); shows('Notificações','notif ok');
eq(DB.ofIsEnabled(),false,'OF off');
eq(DB.diagnose(A.id).length,0,'diagnose');
ok(document.documentElement.scrollWidth<=window.innerWidth+1,'sem overflow');
}catch(e){L.push('FAIL ex '+e.message);}
document.getElementById('o7').innerHTML='<p>PASS '+P+' / FAIL '+F+'</p>'+L.map(function(x){return '<p>'+x+'</p>';}).join('');
})();
</script></body></html>
