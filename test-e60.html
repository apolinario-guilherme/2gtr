<html lang="pt-BR"><head><meta charset="UTF-8"><title>t60</title><link rel="stylesheet" href="css/styles.css"></head><body>

<div id="toasts"></div><div id="modal-root"></div><div id="o7">...</div>
<script src="js/db.js?cb=908"></script>
<script src="js/auth.js?cb=908"></script>
<script src="js/router.js?cb=908"></script>
<script src="js/app.js?cb=908"></script>
<script>
(function(){
var DB=window.Juntos.DB, Auth=window.Juntos.Auth, App=window.Juntos.App;
var P=0,F=0,L=[];
function ok(c,m){if(c){P++;}else{F++;L.push('FAIL '+m);}}
function eq(a,b,m){ok(a===b,m+' [esp '+JSON.stringify(b)+' veio '+JSON.stringify(a)+']');}
function throws(fn,m){var t=false;try{fn();}catch(e){t=true;}ok(t,m);}
function html(){return document.getElementById('view').innerHTML;}
function shows(t,m){ok(html().indexOf(t)>=0,m);}
function hides(t,m){ok(html().indexOf(t)<0,m);}
function as(uid){localStorage.setItem('juntos_session_v1',JSON.stringify({userId:uid}));}
try{localStorage.clear();}catch(e){}
window.scrollTo=function(){};
DB.AI_CONFIG=function(){return {provider:'local-deterministic',model:'local-v1',maxTokens:500,temperature:0,timeoutMs:15000,maxContext:10,maxMessageChars:10000,ratePerMinute:100000};};
DB._waOutbox=[];
try{ App.boot(); }catch(e){ L.push('FAIL boot '+e.message); }
try{
/* --- 1-5: tradicional intacto --- */
var A=Auth.register('Ana S','ana.s@t.t','senha123');
eq(Auth.login('ana.s@t.t','senha123').id,A.id,'login senha');
Auth.logout();
eq(Auth.current(),null,'logout limpa sessao');
var code=Auth.forgot('ana.s@t.t');
ok(/^\d{6}$/.test(code),'codigo reset');
Auth.reset('ana.s@t.t',code,'nova456');
eq(Auth.login('ana.s@t.t','nova456').id,A.id,'redefinicao funciona');
/* --- 6: rotas sociais mortas --- */
eq(typeof Auth.socialGoogle,'undefined','sem google');
eq(typeof Auth.socialFacebook,'undefined','sem facebook');
eq(typeof Auth.socialApple,'undefined','sem apple');
eq(typeof Auth.socialLogin,'undefined','sem socialLogin');
eq(typeof Auth.socialLinkConfirm,'undefined','sem socialLinkConfirm');
eq(typeof Auth.reauthenticateSocial,'undefined','sem reauth social');
App.render('login');
hides('Continuar com Google','sem botao google');
hides('Continuar com Facebook','sem botao facebook');
hides('Continuar com Apple','sem botao apple');
hides('soc-zone','sem zona social');
hides('soc-div','sem divisor social');
shows('Entrar','login tradicional central');
App.render('auth/callback');
shows('Não encontramos esta página','callback morto');
/* --- 7: legado só-social migra via Esqueci a senha --- */
var db0=DB.all();
var leg={id:'u_legado',nome:'Legado S',email:'legado@t.t',salt:null,pass:null,avatar:null,deactivated_at:null,session_version:1,created_at:new Date().toISOString()};
db0.users.push(leg); DB.save(db0);
DB.linkOAuthIdentity('u_legado',{provider:'google',provider_user_id:'g-leg',email:'legado@t.t',email_verified:true});
throws(function(){Auth.login('legado@t.t','qualquer');},'sem senha nao entra');
var code2=Auth.forgot('legado@t.t');
Auth.reset('legado@t.t',code2,'senha789');
eq(Auth.login('legado@t.t','senha789').id,'u_legado','legado migra p/ senha');
/* --- 8: responsivo + base --- */
ok(document.documentElement.scrollWidth<=window.innerWidth+1,'sem overflow');
eq(DB.ofIsEnabled(),false,'OF off');
eq(DB.diagnose('u_legado').length,0,'diagnose');
}catch(e){L.push('FAIL ex '+e.message);}
document.getElementById('o7').innerHTML='<p>PASS '+P+' / FAIL '+F+'</p>'+L.map(function(x){return '<p>'+x+'</p>';}).join('');
})();
</script></body></html>
